import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def releaseStoreFile = localProperties.getProperty('retui.release.storeFile')
def releaseStorePassword = localProperties.getProperty('retui.release.storePassword')
def releaseKeyAlias = localProperties.getProperty('retui.release.keyAlias')
def releaseKeyPassword = localProperties.getProperty('retui.release.keyPassword')
// On-device speech engine and voice activity detector. Both are fetched once into .gradle/
// (gitignored) and pinned by SHA-256 so the binaries never enter git.
def sherpaOnnxVersion = '2.0.1'
def sherpaOnnxAar = rootProject.file(".gradle/sherpa-onnx/sherpa-onnx-${sherpaOnnxVersion}.aar")
def voiceAssetsDir = rootProject.file('.gradle/voice-assets')
def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.eachByte(1 << 16) { buffer, length -> digest.update(buffer, 0, length) }
    digest.digest().encodeHex().toString()
}
def fetchPinned = { String url, String sha256, File target ->
    if (target.isFile() && sha256Of(target) == sha256) return
    target.parentFile.mkdirs()
    def partial = new File(target.path + '.part')
    logger.lifecycle("Downloading ${url}")
    new URL(url).withInputStream { input -> partial.withOutputStream { it << input } }
    def actual = sha256Of(partial)
    if (actual != sha256) {
        partial.delete()
        throw new GradleException("Checksum mismatch for ${target.name}: ${actual}")
    }
    partial.renameTo(target)
}
fetchPinned("https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/sherpa-onnx-${sherpaOnnxVersion}.aar",
        'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7', sherpaOnnxAar)
def noticesDir = rootProject.file('.gradle/notices')
fetchPinned('https://raw.githubusercontent.com/microsoft/onnxruntime/v1.28.2/ThirdPartyNotices.txt',
        '0e07b95f3a8d6230037707c5c4a2b554d12c4cb67369669ac255635528ffcee2', new File(noticesDir, 'onnxruntime-ThirdPartyNotices.txt'))
fetchPinned('https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx',
        '9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6', new File(voiceAssetsDir, 'silero_vad.onnx'))

def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && !value.trim().isEmpty()
}

android {
    namespace = "com.dvil.retui.keyboard"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.dvil.retui.keyboard"
        minSdk = 26
        targetSdk = 36
        versionCode = 33
        versionName = "0.2.0"
    }

    // GitHub releases ship one APK per CPU type. Play builds use the app bundle, which splits on its
    // own, and AGP fails to bundle with APK splits on, so they are only enabled for APK builds.
    def buildingBundle = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('bundle') }
    splits {
        abi {
            enable = !buildingBundle
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk = false
        }
    }

    sourceSets {
        main.assets.srcDirs += [voiceAssetsDir, layout.buildDirectory.dir('generated/notice-assets').get().asFile]
    }

    packaging {
        jniLibs {
            // Compressed native libraries keep the GitHub APK download near 12 MB instead of 28 MB.
            useLegacyPackaging = true
            // The JNI bridge only links against onnxruntime; the C and C++ APIs are unused.
            excludes += ['**/libsherpa-onnx-c-api.so', '**/libsherpa-onnx-cxx-api.so']
            // ARM only: x86 Android devices are rare and Chromebooks run ARM apps via translation.
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation project(':retui-contract')
    implementation("androidx.activity:activity:1.13.0")
    implementation("androidx.core:core:1.17.0")
    implementation(files(sherpaOnnxAar))
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20250517")
}

// Ships THIRD_PARTY_NOTICES.md and every license text as assets/licenses/ for the in-app viewer.
def noticeAssets = tasks.register('noticeAssets', Sync) {
    from(rootProject.projectDir) { include 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'LICENSES/*' }
    from(noticesDir)
    from('src/main/assets/latinime') { include 'NOTICE' }
    eachFile {
        it.path = it.name == 'NOTICE' ? 'AOSP-LatinIME-NOTICE.txt' : it.name == 'LICENSE' ? 'Re-TUI-Keys-LICENSE.txt' : it.name
    }
    includeEmptyDirs = false
    into(layout.buildDirectory.dir('generated/notice-assets/licenses'))
}
tasks.named('preBuild') { dependsOn(noticeAssets) }
